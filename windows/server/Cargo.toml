[package]
name = "freetype-server"
version = "0.0.1"
edition = "2021"
description = "FreeType 服务进程：常驻拼音引擎，经命名管道服务输入法 DLL 和设置程序"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "FreeTypeServer"
path = "src/main.rs"

[dependencies]
freetype-protocol = { path = "../protocol" }
serde_json = "1"
wowtype-core = { path = "../../core", default-features = false }

[target.'cfg(windows)'.dependencies.windows]
version = "0.62.2"
features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_IO",
  "Win32_System_LibraryLoader",
  "Win32_System_Pipes",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_TextServices",
]
