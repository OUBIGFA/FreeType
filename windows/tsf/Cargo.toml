[package]
name = "freetype-tsf"
version = "0.0.1"
edition = "2021"
build = "../version-resource.rs"
description = "FreeType 的 TSF 文本服务（输入法 DLL）"
license = "MIT OR Apache-2.0"
publish = false

[build-dependencies]
embed-resource = "=3.0.12"

[lib]
name = "freetype_tsf"
crate-type = ["cdylib", "rlib"]

[dependencies]
freetype-protocol = { path = "../protocol" }

[target.'cfg(windows)'.dependencies.windows]
version = "0.62.2"
features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_SystemInformation",
  "Win32_System_LibraryLoader",
  "Win32_System_StationsAndDesktops",
  "Win32_System_Ole",
  "Win32_System_Registry",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_TextServices",
  "Win32_UI_WindowsAndMessaging",
]

[target.'cfg(windows)'.dependencies.windows-core]
version = "0.62.2"

[target.'cfg(windows)'.dependencies.windows-numerics]
version = "0.3.1"

[target.'cfg(windows)'.dependencies.unicode-segmentation]
version = "=1.13.3"
